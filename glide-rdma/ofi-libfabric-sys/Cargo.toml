# Libfabric Rust Bindings — vendored into valkey-glide.
#
# Upstream: https://github.com/ofiwg/libfabric, bindings/rust, rev 6953579a5035.
# Vendored so that GLIDE owns `build.rs`.
#
# Divergence from upstream, kept deliberately small:
#   1. Package metadata is inlined rather than inherited from libfabric's workspace.
#   2. `cargo:rustc-link-lib=fabric` is behind the `link-fabric` feature, off by
#      default, so the shipped binary carries no hard reference to libfabric.
#   3. libfabric's public headers are vendored under `include/`, and the bindgen
#      output is generated once and kept as `src/bindings.rs`. Together these mean
#      a build needs neither libfabric nor libclang on the machine. The `vendored`
#      feature, which built libfabric from source purely to obtain headers, is
#      gone: it answered a question that no longer exists.
#
# This software is available to you under a choice of one of two
# licenses. You may choose to be licensed under the terms of the BSD
# license or the GNU General Public License (GPL) Version 2.
#
# See COPYING file for full license details.

[package]
name = "ofi-libfabric-sys"
links = "libfabric"
build = "build.rs"
readme = "README.md"
version = "0.1.0"
edition = "2024"
description = "The official distribution of lightweight Rust bindings for Libfabric - a communication API for high-performance parallel and distributed applications, by the OFI Working Group."
authors = ["Libfabric Developers <libfabric-users@lists.openfabrics.org>"]
license = "BSD-2-Clause OR GPL-2.0-only"
license-file = "COPYING"
homepage = "https://ofiwg.github.io/libfabric/"
repository = "https://github.com/ofiwg/libfabric.git"
documentation = "https://ofiwg.github.io/libfabric/"
keywords = ["libfabric", "hpc", "networking", "rdma", "ffi"]
categories = ["network-programming", "api-bindings"]

[features]
asan = []
# Build against an installed libfabric found through pkg-config, rather than the
# headers vendored under `include/`. Upstream's behaviour. Off by default: the
# API version the bindings describe should be a deliberate choice, not whatever
# the build machine happens to have installed.
system-headers = []
# Re-run bindgen and update `src/bindings.rs` in the tree. Needs libclang.
# Off by default so that ordinary builds, including every release builder, do not.
regenerate-bindings = ["dep:bindgen"]
# Emit `cargo:rustc-link-lib=fabric`, giving the shipped binary a DT_NEEDED /
# LC_LOAD_DYLIB entry for libfabric. Upstream does this unconditionally. Off by
# default here: the symbols are resolved at run time instead, by the dlopen shim
# in glide-rdma.
link-fabric = []

[dependencies]
libc = "0.2"

[build-dependencies]
# Only used by `regenerate-bindings`; the generated file is kept in the tree.
bindgen = { version = "0.72.0", optional = true }
cc = "1.2.26"
pkg-config = "0.3.32"

[dev-dependencies]
paste = "1.0.15"
